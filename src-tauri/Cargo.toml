[package]
name = "omni-office"
version = "0.2.0"
description = "Super fast unified desktop document editor for HWP and Office"
authors = ["SeongHyun Lee <coolmarvel@gmail.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "omni_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
